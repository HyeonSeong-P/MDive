[versions]
agp = "9.4.1"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.10.0"
activityCompose = "1.12.4"
kotlin = "2.2.10"
composeBom = "2026.02.01"

navigation3 = "1.0.1"
hilt = "2.59.2"
androidxHilt = "1.3.0"
ksp = "2.3.5"
coroutines = "1.10.2"

[libraries]
jlatexmath = { module = "ru.noties:jlatexmath-android", version = "0.2.0" }
highlights = { module = "dev.snipme:highlights", version = "1.1.0" }
commonmark-gfm-tables = { module = "org.commonmark:commonmark-ext-gfm-tables", version = "0.31.0" }
